<text x="1380" y="70" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F4EADE" text-anchor="end">ILLUSTRATIVE  ·  SYNTHETIC DATA</text>
