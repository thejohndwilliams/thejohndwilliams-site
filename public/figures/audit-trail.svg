<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 630" width="1440" height="630" role="img" aria-labelledby="t d">
<title id="t">Illustrative, synthetic audit trail for one change: brief opened, draft prepared without merge, read-only screenshot check, a relayed approval rejected, dated Operator approval, merge by the Operator, and a live check.</title><desc id="d">Illustrative, synthetic audit trail for one change: brief opened, draft prepared without merge, read-only screenshot check, a relayed approval rejected, dated Operator approval, merge by the Operator, and a live check.</desc>
