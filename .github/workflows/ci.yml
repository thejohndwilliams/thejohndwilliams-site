name: CI

# Build + full test gate on every PR and EVERY push, any branch.
# Lighthouse runs separately in lighthouse.yml. Added 2026-06-11:
# before this, NOTHING enforced vitest or Playwright on GitHub --
# gates ran only in whichever local environment happened to work.
# Widened from main-only pushes on 2026-07-03: the house workflow ships
# preview branches without PRs, so six lightbox-fix commits (including a
# brand-new e2e spec) reached main having never met CI. Branch pushes
# must gate BEFORE merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# P3 hardening, 2026-07-19: least-privilege token; these jobs only read.
permissions:
  contents: read

jobs:
  test:
    # Pinned 2026-11-14: ubuntu-latest moved to 26.04 and Playwright 1.57
    # cannot install chromium there ("does not support chromium on
    # ubuntu26.04-x64"). Unpin when Playwright is upgraded past that.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (kinetic frames + site + OG images)
        run: npm run build

      - name: Unit + lock suites
        run: npx vitest run

      - name: Upload dist for e2e
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1

  e2e:
    # Pinned 2026-11-14: ubuntu-latest moved to 26.04 and Playwright 1.57
    # cannot install chromium there ("does not support chromium on
    # ubuntu26.04-x64"). Unpin when Playwright is upgraded past that.
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: e2e (chromium + webkit + iphone)
        run: npx playwright test e2e/zz-debug.spec.ts --reporter=line --retries=0 --project=webkit  # TEMP DEBUG, revert

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
