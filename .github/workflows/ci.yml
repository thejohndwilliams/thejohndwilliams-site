name: CI

# Build + full test gate on every PR and EVERY push, any branch.
# Lighthouse runs separately in lighthouse.yml. Added 2026-06-11:
# before this, NOTHING enforced vitest or Playwright on GitHub --
# gates ran only in whichever local environment happened to work.
# Widened from main-only pushes on 2026-07-03: the house workflow ships
# preview branches without PRs, so six lightbox-fix commits (including a
# brand-new e2e spec) reached main having never met CI. Branch pushes
# must gate BEFORE merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# P3 hardening, 2026-07-19: least-privilege token; these jobs only read.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (kinetic frames + site + OG images)
        run: npm run build

      - name: Unit + lock suites
        run: npx vitest run

      - name: Upload dist for e2e
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: e2e (chromium + webkit + iphone)
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
